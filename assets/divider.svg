<svg fill="none" viewBox="0 0 850 16" width="100%" height="16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#7C5CFF" stop-opacity="0.3"/>
      <stop offset="48%" stop-color="#00E5FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="52%" stop-color="#00E5FF" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#7C5CFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Subtle center glow halo -->
  <circle cx="425" cy="8" r="7" fill="url(#center-glow)" />
  
  <!-- Laser Line -->
  <line x1="0" y1="8" x2="850" y2="8" stroke="url(#divider-grad)" stroke-width="1"/>
  
  <!-- Small Center Diamond -->
  <polygon points="425,5 428,8 425,11 422,8" fill="#00E5FF" />
</svg>
