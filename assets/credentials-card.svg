<svg fill="none" viewBox="0 0 850 155" width="100%" height="155" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card-bg {
      fill: #090B10;
      stroke: rgba(124, 92, 255, 0.28);
      stroke-width: 1;
      transition: all 0.3s ease;
    }
    .card-accent {
      fill: url(#accent-cyan-purple);
      opacity: 0.9;
    }
    .value {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 19px;
      font-weight: 700;
      fill: #00E5FF;
      letter-spacing: -0.3px;
    }
    .label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      fill: #F8FAFC;
      letter-spacing: 1px;
    }
    .detail {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 10.5px;
      font-weight: 400;
      fill: #94A3B8;
    }
    .card-dot {
      fill: #7C5CFF;
      opacity: 0.5;
    }
  </style>

  <defs>
    <linearGradient id="accent-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Legal-RAG Research -->
  <g transform="translate(0, 0)">
    <rect x="1" y="1" width="198" height="153" rx="8" class="card-bg" />
    <rect x="1" y="1" width="198" height="3" rx="1" class="card-accent" />
    <circle cx="184" cy="18" r="3" class="card-dot" />
    <text x="18" y="50" class="value">LEGAL-RAG</text>
    <text x="18" y="74" class="label">AI RESEARCH PIPELINE</text>
    <text x="18" y="102" class="detail">Semantic &amp; Recur. Chunking</text>
    <text x="18" y="120" class="detail">3072-dim Vector Retrieval</text>
  </g>

  <!-- Card 2: Oracle Certified -->
  <g transform="translate(217, 0)">
    <rect x="1" y="1" width="198" height="153" rx="8" class="card-bg" />
    <rect x="1" y="1" width="198" height="3" rx="1" class="card-accent" />
    <circle cx="184" cy="18" r="3" class="card-dot" />
    <text x="18" y="50" class="value">ORACLE OCI</text>
    <text x="18" y="74" class="label">CERTIFIED SPECIALIST</text>
    <text x="18" y="102" class="detail">Oracle Cloud Infrastructure</text>
    <text x="18" y="120" class="detail">Agentic AI Architecture</text>
  </g>

  <!-- Card 3: Yoga-AI CV -->
  <g transform="translate(434, 0)">
    <rect x="1" y="1" width="198" height="153" rx="8" class="card-bg" />
    <rect x="1" y="1" width="198" height="3" rx="1" class="card-accent" />
    <circle cx="184" cy="18" r="3" class="card-dot" />
    <text x="18" y="50" class="value">YOGA-AI CV</text>
    <text x="18" y="74" class="label">COMPUTER VISION</text>
    <text x="18" y="102" class="detail">MediaPipe Landmark Engine</text>
    <text x="18" y="120" class="detail">Real-Time Joint Geometry</text>
  </g>

  <!-- Card 4: 250+ DSA -->
  <g transform="translate(651, 0)">
    <rect x="1" y="1" width="198" height="153" rx="8" class="card-bg" />
    <rect x="1" y="1" width="198" height="3" rx="1" class="card-accent" />
    <circle cx="184" cy="18" r="3" class="card-dot" />
    <text x="18" y="50" class="value">250+ DSA</text>
    <text x="18" y="74" class="label">PROBLEM SOLVING</text>
    <text x="18" y="102" class="detail">LeetCode &amp; HackerRank</text>
    <text x="18" y="120" class="detail">Algorithms &amp; Core Data Structs</text>
  </g>
</svg>
